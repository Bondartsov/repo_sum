# Глобальные исключения путей (не проверяем legacy и бенч-утилиты)
exclude = [
    "legacy",
    "tests/bench",
]

[lint]
# В рамках Фазы 1 закрываем замечания за счёт ослабления правил.
# На следующих фазах вернём строгие правила и точечно поправим код.
ignore = [
    "E402",  # Module level import not at top of file
    "E722",  # Do not use bare except
    "E731",  # Do not assign a lambda expression
    "F401",  # Imported but unused
    "F841",  # Local variable assigned to but never used
]

[lint.per-file-ignores]
"tests/mocks/**/*.py" = [
    "SLF001",
]

[lint.flake8-self]
ignore-names = ["_*"]
