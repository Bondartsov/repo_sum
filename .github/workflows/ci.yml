name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run smoke/perf tests (tests/bench/test_search_smoke_perf.py)"
        required: false
        default: "false"

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # По умолчанию smoke/perf тесты пропускаем (их можно запустить вручную через workflow_dispatch)
  RUN_SEARCH_SMOKE: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint (ruff, mypy) + Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Инструменты CI (без фиксации в requirements.txt)
          pip install ruff mypy

      - name: Ruff (lint)
        run: |
          ruff --version
          # Используем существующий .ruff.toml
          ruff check .

      - name: Mypy (type check)
        run: |
          mypy --version
          # Игнорируем отсутствующие типы внешних пакетов, чтобы не падать на сторонних зависимостях
          mypy --ignore-missing-imports --install-types --non-interactive .

      - name: Pytest
        env:
          # Явно выключаем smoke/perf тесты по умолчанию
          RUN_SEARCH_SMOKE: "0"
        run: |
          pytest -q

  smoke-perf:
    name: Smoke/Perf tests (manual)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_smoke == 'true' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run smoke/perf tests
        env:
          RUN_SEARCH_SMOKE: "1"
          # Порог p95 можно переопределить, по умолчанию 10.0s в самом тесте
          PERF_P95_SEC: "10.0"
        run: |
          pytest -q tests/bench/test_search_smoke_perf.py
